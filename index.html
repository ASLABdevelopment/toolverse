<style>
:root{--bg:#07090f;--s1:#0e121b;--s2:#151b27;--ln:#1f2735;--tx:#e8edf8;--mu:#8791a7;--ac:#2f6bff;--ac2:#5b8dff;--ok:#2ecc8f;--er:#ff5c6c;color-scheme:dark}
:root[data-theme=light]{--bg:#f5f7fb;--s1:#fff;--s2:#eef1f8;--ln:#dde3ee;--tx:#10151f;--mu:#5d6679;--ac:#1f5af0;--ac2:#1f5af0;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.55 'Bricolage Grotesque',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--ac2)}
#app{display:flex;min-height:100vh}
aside{width:248px;flex:none;background:var(--s1);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;transition:transform .25s}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 10px 18px;letter-spacing:-.02em}.logo i{width:26px;height:26px;border-radius:8px;background:var(--ac);display:grid;place-items:center}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--mu);text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--s2);color:var(--tx)}.nav a.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--tx);box-shadow:inset 2px 0 var(--ac)}
.nav hr{border:0;border-top:1px solid var(--ln);margin:10px 4px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:5}
#q{flex:1;max-width:520px;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;outline:0}
#q:focus,textarea:focus,input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent);outline:0}
.sq{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;cursor:pointer;transition:border-color .15s}.sq:hover{border-color:var(--ac)}
#burger{display:none}
#view{padding:26px 22px 60px;max-width:980px;width:100%}
h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.03em;margin:0 0 6px;font-weight:800}h2{font-size:15px;margin:28px 0 8px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);margin:0 0 22px;max-width:60ch}
.list{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--s1)}
.row2{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);text-decoration:none;color:inherit;transition:background .15s}
.row2:last-child{border:0}.row2:hover{background:var(--s2)}.row2 .t{flex:1;min-width:0}.row2 b{display:block;font-weight:600}.row2 small{color:var(--mu)}
.badge{width:34px;height:34px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--ac2);flex:none}
.star{background:0;border:0;color:var(--mu);cursor:pointer;padding:6px;border-radius:8px}.star.on{color:#ffc24b}.star.on svg{fill:#ffc24b}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips a{padding:6px 12px;border:1px solid var(--ln);border-radius:99px;text-decoration:none;color:var(--tx);font-size:14px}.chips a:hover{border-color:var(--ac)}
.panel{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:18px;display:grid;gap:12px}
textarea,input,select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}textarea{min-height:140px;resize:vertical}
input[type=color]{padding:2px;height:42px}input[type=range]{padding:0;accent-color:var(--ac)}input[type=checkbox]{width:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto;width:auto}.row>input,.row>select{flex:1 1 140px}
button.primary,button.ghost{border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid var(--ln);transition:transform .1s,background .15s}
button.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.primary:hover{background:var(--ac2)}button.ghost{background:var(--s2)}button:active{transform:scale(.97)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px;min-height:48px}
.big{font-size:clamp(34px,8vw,56px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pv{display:flex;gap:14px;flex-wrap:wrap}.pv img{max-width:220px;border-radius:10px}.spin{width:16px;height:16px;border:2px solid #fff5;border-top-color:#fff;border-radius:50%;display:inline-block;animation:r .7s linear infinite;vertical-align:-3px}@keyframes r{to{transform:rotate(1turn)}}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;gap:8px;z-index:20}
.toast{background:var(--s2);border:1px solid var(--ln);border-left:3px solid var(--ok);padding:10px 14px;border-radius:10px;animation:in .2s}.toast.err{border-left-color:var(--er)}@keyframes in{from{transform:translateY(8px);opacity:0}}
footer{margin-top:auto;padding:16px 22px;color:var(--mu);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ln)}footer a{color:var(--mu)}
@media(max-width:820px){aside{position:fixed;z-index:10;transform:translateX(-100%);left:0}aside.open{transform:none}#burger{display:block}header{padding:10px 14px}#view{padding:20px 14px 60px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"><aside id="side"></aside><div id="main"><header><button class="sq" id="burger" aria-label="Menu"></button><input id="q" type="search" autocomplete="off"><button class="sq" id="lang">ID</button><button class="sq" id="theme" aria-label="Tema"></button></header><main id="view"></main><footer id="foot"></footer></div></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== Konfigurasi: kosongkan jika backend satu domain, atau isi URL backend (mis. https://api.domainanda.com) ===== */
const API_BASE="";
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const P={home:'M3 11l9-8 9 8v10H4zM9 21v-7h6v7',dl:'M12 3v12m0 0l-4-4m4 4l4-4M4 21h16',link:'M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1',file:'M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5',text:'M4 6h16M4 12h10M4 18h14',dev:'M8 8l-5 4 5 4M16 8l5 4-5 4M14 4l-4 16',extra:'M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3',star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',menu:'M4 6h16M4 12h16M4 18h16',sun:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const D={id:{search:'Cari tool…',home:'Beranda',fav:'Favorit',hist:'Riwayat',recent:'Terakhir dipakai',all:'Semua tool',copy:'Salin',copied:'Tersalin',none:'Belum ada. Tandai bintang pada tool untuk menyimpannya di sini.',nores:'Tidak ada tool yang cocok.',sub:'Tools digital gratis dalam satu tempat. Data diproses di perangkatmu kecuali tool yang jelas membutuhkan server.',clear:'Hapus riwayat'},
en:{search:'Search tools…',home:'Home',fav:'Favorites',hist:'History',recent:'Recently used',all:'All tools',copy:'Copy',copied:'Copied',none:'Nothing yet. Star a tool to keep it here.',nores:'No matching tools.',sub:'Free digital tools in one place. Data stays on your device unless a tool clearly needs a server.',clear:'Clear history'}};
let lang=LS.get('tv_lang','id');const t=k=>D[lang][k];
const CATS={dl:['Downloader','Downloader'],link:['Link','Links'],file:['File','Files'],text:['Teks','Text'],dev:['Developer','Developer'],extra:['Ekstra','Extras']};
const cn=c=>CATS[c][lang=='id'?0:1];
function toast(m,err){const e=document.createElement('div');e.className='toast'+(err?' err':'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast(t('copied'))}catch{toast('Clipboard ditolak browser',1)}}
async function api(path,opt){const r=await fetch(API_BASE+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||'Server error '+r.status);return j}
const hist=(type,label)=>{const h=LS.get('tv_hist',[]);h.unshift({type,label,at:Date.now()});LS.set('tv_hist',h.slice(0,50))};

/* ---- helper: tool berbasis textarea + tombol aksi ---- */
function tt(el,{ph='',acts,live,pre='',init=''}){
 el.innerHTML=`${pre}<textarea id="in" placeholder="${esc(ph)}">${esc(init)}</textarea><div class="row">${acts.map((a,i)=>`<button class="${i?'ghost':'primary'}" data-i="${i}">${a[0]}</button>`).join('')}</div><div class="row" style="align-items:stretch"><pre id="out" style="flex:1"></pre><button class="ghost" id="cp">${t('copy')}</button></div>`;
 const run=async i=>{try{$('#out',el).textContent=await acts[i][1]($('#in',el).value,el)}catch(e){toast(e.message,1)}};
 el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>run(+b.dataset.i));
 if(live)$('#in',el).oninput=()=>run(0);$('#cp',el).onclick=()=>copy($('#out',el).textContent);if(live)run(0)}
const words=s=>(s.trim().match(/\S+/g)||[]);
const cases={'UPPER':s=>s.toUpperCase(),'lower':s=>s.toLowerCase(),'Title':s=>s.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()),'Sentence':s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\S)/g,(m,a,b)=>a+b.toUpperCase()),'camelCase':s=>words(s.toLowerCase()).map((w,i)=>i?w[0].toUpperCase()+w.slice(1):w).join(''),'snake_case':s=>words(s.toLowerCase()).join('_'),'kebab-case':s=>words(s.toLowerCase()).join('-')};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=a=>async s=>hex(await crypto.subtle.digest(a,new TextEncoder().encode(s)));
function qr(box,text){box.innerHTML='';if(!text)return toast('Isi dulu teksnya',1);new QRCode(box,{text,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});const dl=document.createElement('button');dl.className='ghost';dl.textContent='Download PNG';dl.onclick=()=>{const c=box.querySelector('canvas'),a=document.createElement('a');a.href=c.toDataURL();a.download='qr.png';a.click()};box.append(dl)}
const fmtU=n=>String(n).padStart(2,'0');

/* ---- Registry tools ---- */
const TOOLS=[
{id:'downloader',cat:'dl',n:'Social Media Downloader',d:'TikTok, Instagram, YouTube, Facebook, Pinterest, X — butuh backend downloader',r(el){
 const PL={'TikTok Video':/tiktok\.com/,'Facebook Video':/(facebook\.com|fb\.watch)/,'Instagram Reels':/instagram\.com\/(reel|reels)\//,'Instagram Photo':/instagram\.com\/p\//,'YouTube Video':/(youtube\.com\/watch|youtu\.be\/)/,'YouTube Shorts':/youtube\.com\/shorts\//,'Pinterest Video':/(pinterest\.[a-z.]+|pin\.it)/,'X / Twitter Video':/(x\.com|twitter\.com)\/.+\/status\//};
 el.innerHTML=`<select id="pl">${Object.keys(PL).map(k=>`<option>${k}</option>`)}</select><div class="row"><input id="u" placeholder="https://…" inputmode="url"><button class="ghost" id="pa">Paste link</button><button class="primary" id="go">Download</button></div><div id="res"></div><p class="sub">Unduh hanya konten milikmu atau yang diizinkan pemiliknya. Kualitas dan watermark mengikuti apa yang dikembalikan layanan backend.</p>`;
 $('#pa',el).onclick=async()=>{try{$('#u',el).value=await navigator.clipboard.readText()}catch{toast('Tidak bisa membaca clipboard',1)}};
 $('#go',el).onclick=async()=>{const u=$('#u',el).value.trim(),p=$('#pl',el).value,b=$('#go',el);let ok;try{ok=/^https?:\/\//.test(u)&&new URL(u)&&PL[p].test(u)}catch{}
  if(!ok)return toast('URL tidak valid untuk '+p,1);b.disabled=true;b.innerHTML='<span class="spin"></span>';
  try{const j=await api('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,platform:p})});
   $('#res',el).innerHTML=`<div class="panel pv">${j.thumbnail?`<img src="${esc(j.thumbnail)}" alt="">`:''}<div><b>${esc(j.title||'Tanpa judul')}</b><br><small>${j.duration?esc(j.duration):''}</small><div class="row" style="margin-top:10px">${(j.formats||[]).map(f=>`<a class="ghost" style="padding:8px 12px;border:1px solid var(--ln);border-radius:10px;text-decoration:none" href="${esc(f.url)}" target="_blank" rel="noopener" download>${esc(f.quality||'')} ${esc(f.format||'')}</a>`).join('')}</div></div></div>`;hist('download',j.title||u);toast('Berhasil')}
  catch(e){$('#res',el).innerHTML='';toast(e.message,1)}b.disabled=false;b.textContent='Download'}}},
{id:'expand',cat:'link',n:'URL Expander & Redirect Checker',d:'Lihat setiap lompatan redirect sebelum membuka link',r(el){tt(el,{ph:'https://bit.ly/…',acts:[['Periksa',async u=>{const j=await api('/api/expand?url='+encodeURIComponent(u.trim()));return j.hops.map((h,i)=>`${i+1}. [${h.status}] ${h.url}`).join('\n')+'\n\nTujuan akhir: '+j.final+(j.hops.length>3?'\nPeringatan: redirect berlapis ('+j.hops.length+' hop)':'')}]]})}},
{id:'urlenc',cat:'link',n:'URL Encoder / Decoder',d:'Encode atau decode karakter di URL',r(el){tt(el,{acts:[['Encode',s=>encodeURIComponent(s)],['Decode',s=>decodeURIComponent(s)]]})}},
{id:'qr',cat:'link',n:'QR Code Generator',d:'Buat QR dari teks atau link, unduh PNG',r(el){el.innerHTML='<input id="v" placeholder="Teks atau https://…"><div class="row"><button class="primary" id="g">Buat QR</button></div><div id="b" class="row"></div>';$('#g',el).onclick=()=>qr($('#b',el),$('#v',el).value.trim())}},
{id:'wifiqr',cat:'extra',n:'WiFi QR Generator',d:'QR untuk sambung WiFi tanpa mengetik sandi',r(el){el.innerHTML='<input id="s" placeholder="Nama WiFi (SSID)"><div class="row"><input id="p" placeholder="Sandi"><select id="e"><option>WPA</option><option>WEP</option><option value="nopass">Tanpa sandi</option></select></div><div class="row"><button class="primary" id="g">Buat QR</button></div><div id="b" class="row"></div>';$('#g',el).onclick=()=>{const e=s=>s.replace(/([\\;,:"])/g,'\\$1'),s=$('#s',el).value;if(!s)return toast('Isi nama WiFi',1);qr($('#b',el),`WIFI:T:${$('#e',el).value};S:${e(s)};P:${e($('#p',el).value)};;`)}}},
{id:'imgconv',cat:'file',n:'Image Converter & Compressor',d:'JPG, PNG, WebP — kompres dan ubah ukuran di browser',r(el){el.innerHTML=`<input type="file" id="f" accept="image/*"><div class="row"><select id="fm"><option value="image/webp">WebP</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select><label>Kualitas <input type="range" id="qu" min="10" max="100" value="80"></label><input id="mw" type="number" placeholder="Lebar maks (px)"></div><div class="row"><button class="primary" id="g">Proses</button></div><div id="o"></div><p class="sub">File tidak diunggah ke server mana pun.</p>`;
 $('#g',el).onclick=()=>{const f=$('#f',el).files[0];if(!f)return toast('Pilih gambar dulu',1);const im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=+$('#mw',el).value;if(m&&w>m){h=h*m/w;w=m}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if($('#fm',el).value=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(im,0,0,w,h);
  c.toBlob(b=>{if(!b)return toast('Format tidak didukung browser',1);const u=URL.createObjectURL(b),ext=$('#fm',el).value.split('/')[1];$('#o',el).innerHTML=`<div class="panel pv"><img src="${u}" alt=""><div>${(f.size/1024).toFixed(0)} KB → <b>${(b.size/1024).toFixed(0)} KB</b><br><br><a class="primary" style="padding:9px 16px;border-radius:10px;text-decoration:none;color:#fff;background:var(--ac)" href="${u}" download="toolverse.${ext}">Download</a></div></div>`;toast('Selesai')},$('#fm',el).value,$('#qu',el).value/100)};im.onerror=()=>toast('File bukan gambar valid',1);im.src=URL.createObjectURL(f)}}},
{id:'case',cat:'text',n:'Text Case Converter',d:'UPPER, Title, camelCase, snake_case, dan lainnya',r(el){tt(el,{acts:Object.entries(cases).map(([k,f])=>[k,f])})}},
{id:'count',cat:'text',n:'Word & Character Counter',d:'Hitung kata, karakter, baris, waktu baca',r(el){tt(el,{live:1,acts:[['Hitung',s=>`Kata: ${words(s).length}\nKarakter: ${s.length}\nTanpa spasi: ${s.replace(/\s/g,'').length}\nBaris: ${s?s.split('\n').length:0}\nWaktu baca: ~${Math.ceil(words(s).length/200)} menit`]]})}},
{id:'format',cat:'text',n:'Text Formatter & Dedupe',d:'Rapikan spasi, urutkan, hapus baris ganda',r(el){tt(el,{acts:[['Hapus baris ganda',s=>[...new Set(s.split('\n'))].join('\n')],['Rapikan spasi',s=>s.split('\n').map(l=>l.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n')],['Urutkan A–Z',s=>s.split('\n').sort((a,b)=>a.localeCompare(b)).join('\n')]]})}},
{id:'json',cat:'text',n:'JSON Formatter & Validator',d:'Format, minify, dan validasi JSON',r(el){tt(el,{ph:'{"nama":"toolverse"}',acts:[['Format',s=>JSON.stringify(JSON.parse(s),null,2)],['Minify',s=>JSON.stringify(JSON.parse(s))],['Validasi',s=>{JSON.parse(s);toast('JSON valid');return 'JSON valid'}]]})}},
{id:'base64',cat:'text',n:'Base64 Encoder / Decoder',d:'Mendukung teks Unicode',r(el){tt(el,{acts:[['Encode',s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)))],['Decode',s=>new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)))]]})}},
{id:'hash',cat:'text',n:'SHA Hash Generator',d:'SHA-1, SHA-256, SHA-384, SHA-512 (MD5 tidak didukung browser)',r(el){tt(el,{acts:['SHA-256','SHA-1','SHA-384','SHA-512'].map(a=>[a,sha(a)])})}},
{id:'password',cat:'text',n:'Password Generator',d:'Acak dengan crypto API browser',r(el){el.innerHTML='<div class="row"><label>Panjang <input id="l" type="number" value="16" min="6" max="64" style="width:80px"></label><label><input type="checkbox" id="n" checked> Angka</label><label><input type="checkbox" id="s" checked> Simbol</label></div><div class="row"><button class="primary" id="g">Buat</button></div><div class="row" style="align-items:stretch"><pre id="out" style="flex:1"></pre><button class="ghost" id="cp">'+t('copy')+'</button></div>';
 $('#g',el).onclick=()=>{let c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ'+($('#n',el).checked?'23456789':'')+($('#s',el).checked?'!@#$%^&*-_=+?':''),n=Math.min(64,Math.max(6,+$('#l',el).value||16)),a=crypto.getRandomValues(new Uint32Array(n));$('#out',el).textContent=[...a].map(x=>c[x%c.length]).join('')};$('#cp',el).onclick=()=>copy($('#out',el).textContent);$('#g',el).click()}},
{id:'uuid',cat:'dev',n:'UUID Generator',d:'UUID v4, sebanyak yang kamu mau',r(el){tt(el,{ph:'Jumlah (default 5)',acts:[['Buat',s=>Array.from({length:Math.min(100,+s||5)},()=>crypto.randomUUID()).join('\n')]]})}},
{id:'time',cat:'dev',n:'Timestamp Converter',d:'Unix ↔ tanggal',r(el){tt(el,{ph:'1700000000 atau 2026-11-17 10:00',init:String(Math.floor(Date.now()/1e3)),acts:[['Konversi',s=>{s=s.trim();let d=/^\d+$/.test(s)?new Date(s.length<=10?s*1e3:+s):new Date(s);if(isNaN(d))throw Error('Format tidak dikenali');return `Unix (s): ${Math.floor(d/1e3)}\nUnix (ms): ${+d}\nISO: ${d.toISOString()}\nLokal: ${d.toLocaleString()}`}]]})}},
{id:'color',cat:'dev',n:'Color Picker',d:'HEX, RGB, HSL',r(el){el.innerHTML='<input type="color" id="c" value="#2f6bff"><pre id="out"></pre>';const f=()=>{const h=$('#c',el).value,[r,g,b]=[1,3,5].map(i=>parseInt(h.substr(i,2),16)),m=Math.max(r,g,b)/255,n=Math.min(r,g,b)/255,l=(m+n)/2,d=m-n,s=d?d/(1-Math.abs(2*l-1)):0,H=!d?0:m==r/255?((g-b)/255/d+6)%6:m==g/255?(b-r)/255/d+2:(r-g)/255/d+4;$('#out',el).textContent=`${h}\nrgb(${r}, ${g}, ${b})\nhsl(${Math.round(H*60)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`};$('#c',el).oninput=f;f()}},
{id:'gradient',cat:'dev',n:'CSS Gradient Generator',d:'Dua warna, sudut, kode CSS siap salin',r(el){el.innerHTML='<div class="row"><input type="color" id="a" value="#2f6bff"><input type="color" id="b" value="#7c3aed"><input type="range" id="d" min="0" max="360" value="135"></div><div id="pv" style="height:120px;border-radius:12px"></div><div class="row" style="align-items:stretch"><pre id="out" style="flex:1"></pre><button class="ghost" id="cp">'+t('copy')+'</button></div>';const f=()=>{const g=`linear-gradient(${$('#d',el).value}deg, ${$('#a',el).value}, ${$('#b',el).value})`;$('#pv',el).style.background=g;$('#out',el).textContent=`background: ${g};`};el.oninput=f;$('#cp',el).onclick=()=>copy($('#out',el).textContent);f()}},
{id:'regex',cat:'dev',n:'Regex Tester',d:'Uji pola dan lihat semua kecocokan',r(el){tt(el,{ph:'Teks uji',pre:'<div class="row"><input id="re" placeholder="pola, mis. \\d+"><input id="fl" value="g" style="max-width:90px"></div>',live:1,acts:[['Uji',(s,e)=>{try{const r=new RegExp($('#re',e).value,$('#fl',e).value),m=$('#fl',e).value.includes('g')?[...s.matchAll(r)]:[s.match(r)].filter(Boolean);return m.length?m.map(x=>`@${x.index}: ${x[0]}`).join('\n'):'Tidak ada kecocokan'}catch(x){return 'Regex tidak valid: '+x.message}}]]});el.querySelectorAll('.row input').forEach(i=>i.oninput=()=>$('#in',el).dispatchEvent(new Event('input')))}},
{id:'cssmin',cat:'dev',n:'CSS Minifier',d:'Hapus komentar dan spasi berlebih',r(el){tt(el,{acts:[['Minify',s=>s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*([{};:,>])\s*/g,'$1').replace(/;}/g,'}').trim()]]})}},
{id:'htmlprev',cat:'dev',n:'HTML Preview',d:'Render HTML di sandbox aman',r(el){el.innerHTML='<textarea id="h" placeholder="<h1>Halo</h1>"></textarea><iframe id="f" sandbox style="width:100%;height:240px;border:1px solid var(--ln);border-radius:10px;background:#fff"></iframe>';$('#h',el).oninput=e=>$('#f',el).srcdoc=e.target.value}},
{id:'ip',cat:'dev',n:'IP Information Lookup',d:'Info IP/domain — butuh backend',r(el){tt(el,{ph:'Kosongkan untuk IP kamu, atau isi IP',acts:[['Cari',async s=>JSON.stringify(await api('/api/ip?ip='+encodeURIComponent(s.trim())),null,2)]]})}},
{id:'dns',cat:'dev',n:'DNS Lookup',d:'A, AAAA, MX, TXT, NS — butuh backend',r(el){tt(el,{ph:'example.com',acts:[['Cari',async s=>JSON.stringify(await api('/api/dns?domain='+encodeURIComponent(s.trim())),null,2)]]})}},
{id:'calc',cat:'extra',n:'Calculator',d:'+ − × ÷ % dan tanda kurung',r(el){tt(el,{ph:'(12+8)*3/4',acts:[['Hitung',s=>{if(!/^[\d+\-*/().%\s]+$/.test(s))throw Error('Hanya angka dan + - * / % ( )');return String(Function('"use strict";return('+s+')')())}]]})}},
{id:'random',cat:'extra',n:'Random Number & Username',d:'Angka acak dan username unik',r(el){el.innerHTML='<div class="row"><input id="a" type="number" value="1"><input id="b" type="number" value="100"><button class="primary" id="n">Angka</button><button class="ghost" id="u">Username</button></div><div class="big" id="out">–</div>';const R=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;$('#n',el).onclick=()=>{const a=+$('#a',el).value,b=+$('#b',el).value;if(b<a)return toast('Maks harus ≥ min',1);$('#out',el).textContent=a+R(b-a+1)};
 const A=['biru','senyap','cepat','kelabu','tenang','liar','nova','kuarsa'],B=['elang','kodok','panda','badai','rubah','pixel','bayang','orbit'];$('#u',el).onclick=()=>{$('#out',el).textContent=A[R(8)]+'_'+B[R(8)]+R(900)+100}}},
{id:'stopwatch',cat:'extra',n:'Stopwatch',d:'Dengan lap',r(el){let t0=0,acc=0,iv;el.innerHTML='<div class="big" id="d">00:00.00</div><div class="row"><button class="primary" id="s">Mulai</button><button class="ghost" id="l">Lap</button><button class="ghost" id="r">Reset</button></div><pre id="out"></pre>';const f=()=>{const m=acc+(t0?Date.now()-t0:0);return fmtU(Math.floor(m/6e4))+':'+fmtU(Math.floor(m/1e3)%60)+'.'+fmtU(Math.floor(m/10)%100)},u=()=>$('#d',el).textContent=f();
 $('#s',el).onclick=()=>{if(t0){acc+=Date.now()-t0;t0=0;clearInterval(iv);$('#s',el).textContent='Lanjut'}else{t0=Date.now();iv=setInterval(u,30);$('#s',el).textContent='Jeda'}};$('#l',el).onclick=()=>{$('#out',el).textContent+=f()+'\n'};$('#r',el).onclick=()=>{clearInterval(iv);t0=acc=0;$('#s',el).textContent='Mulai';$('#out',el).textContent='';u()};window.__cleanup=()=>clearInterval(iv)}},
{id:'timer',cat:'extra',n:'Timer',d:'Hitung mundur dengan notifikasi',r(el){let iv;el.innerHTML='<div class="big" id="d">00:00</div><div class="row"><input id="m" type="number" min="0" value="5" style="max-width:90px"> menit <input id="s" type="number" min="0" value="0" style="max-width:90px"> detik <button class="primary" id="g">Mulai</button></div>';$('#g',el).onclick=()=>{clearInterval(iv);let e=Date.now()+(+$('#m',el).value*60+ +$('#s',el).value)*1e3;iv=setInterval(()=>{const r=Math.max(0,Math.ceil((e-Date.now())/1e3));$('#d',el).textContent=fmtU(Math.floor(r/60))+':'+fmtU(r%60);if(!r){clearInterval(iv);toast('Waktu habis!');navigator.vibrate&&navigator.vibrate(300)}},200)};window.__cleanup=()=>clearInterval(iv)}},
{id:'currency',cat:'extra',n:'Currency Converter',d:'Kurs referensi ECB via frankfurter.app',r(el){const C=['IDR','USD','EUR','JPY','GBP','SGD','AUD','MYR'];el.innerHTML=`<div class="row"><input id="a" type="number" value="1"><select id="f">${C.map(c=>`<option ${c=='USD'?'selected':''}>${c}</option>`)}</select><select id="to">${C.map(c=>`<option ${c=='IDR'?'selected':''}>${c}</option>`)}</select><button class="primary" id="g">Konversi</button></div><div class="big" id="out">–</div>`;$('#g',el).onclick=async()=>{const f=$('#f',el).value,o=$('#to',el).value;try{const r=await fetch(`https://api.frankfurter.app/latest?amount=${$('#a',el).value}&from=${f}&to=${o}`);if(!r.ok)throw Error('Pasangan mata uang tidak tersedia');const j=await r.json();$('#out',el).textContent=j.rates[o].toLocaleString()+' '+o}catch(e){toast(e.message,1)}}}},
{id:'weather',cat:'extra',n:'Weather Checker',d:'Cuaca kota via Open-Meteo (tanpa API key)',r(el){el.innerHTML='<div class="row"><input id="c" placeholder="Nama kota, mis. Bandung"><button class="primary" id="g">Cek</button></div><pre id="out"></pre>';$('#g',el).onclick=async()=>{try{const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent($('#c',el).value))).json();if(!g.results)throw Error('Kota tidak ditemukan');const p=g.results[0],w=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation`)).json()).current;$('#out',el).textContent=`${p.name}, ${p.country}\nSuhu: ${w.temperature_2m}°C\nKelembapan: ${w.relative_humidity_2m}%\nAngin: ${w.wind_speed_10m} km/j\nHujan: ${w.precipitation} mm`}catch(e){toast(e.message,1)}}}},
{id:'speed',cat:'extra',n:'Internet Speed Test',d:'Uji unduh via Cloudflare',r(el){el.innerHTML='<div class="big" id="out">– Mbps</div><div class="row"><button class="primary" id="g">Mulai tes</button></div><small class="sub">Mengunduh ±10 MB dari speed.cloudflare.com.</small>';$('#g',el).onclick=async()=>{const b=$('#g',el);b.disabled=true;try{const s=performance.now(),r=await fetch('https://speed.cloudflare.com/__down?bytes=10000000',{cache:'no-store'}),buf=await r.arrayBuffer();$('#out',el).textContent=(buf.byteLength*8/1e6/((performance.now()-s)/1e3)).toFixed(1)+' Mbps';toast('Selesai')}catch{toast('Tes gagal. Periksa koneksi.',1)}b.disabled=false}}}
];
const byId=Object.fromEntries(TOOLS.map(x=>[x.id,x]));

/* ---- UI ---- */
const view=$('#view');let fav=LS.get('tv_fav',[]),rec=LS.get('tv_rec',[]);
const row=x=>`<a class="row2" href="#t-${x.id}"><span class="badge">${ic(x.cat)}</span><span class="t"><b>${x.n}</b><small>${x.d}</small></span><button class="star ${fav.includes(x.id)?'on':''}" data-f="${x.id}" aria-label="Favorit">${ic('star')}</button></a>`;
function side(){const h=location.hash.slice(1)||'home';$('#side').innerHTML=`<div class="logo"><i>${ic('extra').replace('class="ic"','class="ic" style="stroke:#fff"')}</i>TOOLVERSE</div><nav class="nav"><a href="#home" class="${h=='home'?'on':''}">${ic('home')}${t('home')}</a><a href="#fav" class="${h=='fav'?'on':''}">${ic('star')}${t('fav')}</a><hr>${Object.keys(CATS).map(c=>`<a href="#cat-${c}" class="${h=='cat-'+c?'on':''}">${ic(c)}${cn(c)}</a>`).join('')}<hr><a href="#hist" class="${h=='hist'?'on':''}">${ic('menu')}${t('hist')}</a></nav>`;
 $('#q').placeholder=t('search');$('#lang').textContent=lang.toUpperCase();$('#theme').innerHTML=ic('sun');$('#burger').innerHTML=ic('menu');
 $('#foot').innerHTML='<span>© 2026 TOOLVERSE</span><a href="#about">About</a><a href="#contact">Contact</a><a href="#privacy">Privacy Policy</a><a href="#terms">Terms of Service</a>'}
const PAGES={about:['About','TOOLVERSE adalah kumpulan tools digital gratis. Sebagian besar tool berjalan langsung di browsermu; tool yang butuh server dijelaskan di halamannya masing-masing.'],contact:['Contact','Kirim saran atau laporan bug ke <a href="mailto:hello@example.com">hello@example.com</a> (ganti dengan email kamu).'],privacy:['Privacy Policy','Favorit, riwayat, bahasa, dan tema disimpan hanya di localStorage perangkatmu dan bisa dihapus kapan saja. Teks dan file yang kamu proses di tool klien tidak dikirim ke server. Tool yang memakai backend (downloader, expander, IP, DNS) mengirim input ke server hanya saat kamu menekan tombolnya, dan backend ini tidak menyimpannya.'],terms:['Terms of Service','Gunakan tools ini secara sah. Kamu bertanggung jawab atas konten yang kamu unduh atau proses dan wajib mematuhi ketentuan platform sumbernya serta hak cipta. Layanan diberikan apa adanya tanpa jaminan.']};
function route(){window.__cleanup&&window.__cleanup();window.__cleanup=null;const h=location.hash.slice(1)||'home',q=$('#q').value.trim().toLowerCase();side();$('#side').classList.remove('open');scrollTo(0,0);let o='';document.title='TOOLVERSE – All In One Tools';
 if(h.startsWith('t-')&&byId[h.slice(2)]){const x=byId[h.slice(2)];document.title=x.n+' – TOOLVERSE';view.innerHTML=`<h1>${x.n}</h1><p class="sub">${x.d}</p><div class="panel" id="tool"></div>`;rec=[x.id,...rec.filter(i=>i!=x.id)].slice(0,8);LS.set('tv_rec',rec);x.r($('#tool'));return}
 if(PAGES[h]){view.innerHTML=`<h1>${PAGES[h][0]}</h1><p class="sub">${PAGES[h][1]}</p>`;return}
 if(h=='hist'){const H=LS.get('tv_hist',[]);view.innerHTML=`<h1>${t('hist')}</h1><p class="sub">Disimpan hanya di perangkat ini.</p><div class="list">${H.length?H.map(i=>`<div class="row2"><span class="t"><b>${esc(i.label)}</b><small>${i.type} · ${new Date(i.at).toLocaleString()}</small></span></div>`).join(''):`<div class="row2"><small>${t('none')}</small></div>`}</div><p><button class="ghost" id="ch">${t('clear')}</button></p>`;$('#ch').onclick=()=>{LS.set('tv_hist',[]);route()};return}
 let list=TOOLS,title=t('all');if(h=='fav'){list=TOOLS.filter(x=>fav.includes(x.id));title=t('fav')}else if(h.startsWith('cat-')){list=TOOLS.filter(x=>x.cat==h.slice(4));title=cn(h.slice(4))}
 if(q)list=list.filter(x=>(x.n+x.d).toLowerCase().includes(q));
 o=`<h1>${h=='home'&&!q?'TOOLVERSE':title}</h1><p class="sub">${t('sub')}</p>`;
 if(h=='home'&&!q&&rec.length)o+=`<h2>${t('recent')}</h2><div class="chips">${rec.map(i=>`<a href="#t-${i}">${byId[i].n}</a>`).join('')}</div><h2>${t('all')}</h2>`;
 o+=`<div class="list">${list.length?list.map(row).join(''):`<div class="row2"><small>${h=='fav'&&!q?t('none'):t('nores')}</small></div>`}</div>`;view.innerHTML=o}
view.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;e.preventDefault();const i=b.dataset.f;fav=fav.includes(i)?fav.filter(x=>x!=i):[...fav,i];LS.set('tv_fav',fav);b.classList.toggle('on');if(location.hash=='#fav')route()});
$('#q').oninput=()=>{if(location.hash.startsWith('#t-')||PAGES[location.hash.slice(1)]||location.hash=='#hist')location.hash='home';else route()};
$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#lang').onclick=()=>{lang=lang=='id'?'en':'id';LS.set('tv_lang',lang);document.documentElement.lang=lang;route()};
const setTheme=m=>{document.documentElement.dataset.theme=m;LS.set('tv_theme',m)};$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme=='light'?'dark':'light');setTheme(LS.get('tv_theme','dark'));
addEventListener('hashchange',route);route();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
